<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/animations.css"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/admin.css">
<title>Schedule</title>
<style>.sub-table{animation:transitionIn-Y-bottom .5s}.session-form{display:none;margin:20px 45px;padding:20px;border:1px solid #ddd;border-radius:10px}.session-form.show{display:block}.session-form input,.session-form select{margin:6px;width:95%;padding:10px}.msg{padding:15px;text-align:center}</style>
<script src="admin-common.js"></script>
</head><body>
<div class="container"><div class="menu"><table class="menu-container" border="0"><tr><td style="padding:10px" colspan="2"><table border="0" class="profile-container"><tr><td width="30%" style="padding-left:20px"><img src="../img/user.png" width="100%" style="border-radius:50%"></td><td style="padding:0"><p class="profile-title" id="adminName">Administrator</p><p class="profile-subtitle" id="adminEmail"></p></td></tr><tr><td colspan="2"><input type="button" value="Log out" class="logout-btn btn-primary-soft btn" id="logoutBtn"></td></tr></table></td></tr>
<tr class="menu-row"><td class="menu-btn menu-icon-dashbord"><a href="index.html" class="non-style-link-menu"><div><p class="menu-text">Dashboard</p></div></a></td></tr>
<tr class="menu-row"><td class="menu-btn menu-icon-doctor"><a href="doctors.html" class="non-style-link-menu"><div><p class="menu-text">Doctors</p></div></a></td></tr>
<tr class="menu-row"><td class="menu-btn menu-icon-schedule menu-active menu-icon-schedule-active"><a href="schedule.html" class="non-style-link-menu non-style-link-menu-active"><div><p class="menu-text">Schedule</p></div></a></td></tr>
<tr class="menu-row"><td class="menu-btn menu-icon-appoinment"><a href="appointment.html" class="non-style-link-menu"><div><p class="menu-text">Appointment</p></div></a></td></tr>
<tr class="menu-row"><td class="menu-btn menu-icon-patient"><a href="patient.html" class="non-style-link-menu"><div><p class="menu-text">Patients</p></div></a></td></tr></table></div>
<div class="dash-body"><table border="0" width="100%" style="border-spacing:0;margin:0;padding:0;margin-top:25px"><tr><td width="13%"><a href="index.html"><button class="login-btn btn-primary-soft btn btn-icon-back" style="padding:11px;margin-left:20px;width:125px">Back</button></a></td><td><p style="font-size:23px;padding-left:12px;font-weight:600">Schedule Manager</p></td><td width="15%"><p style="font-size:14px;color:#777;padding:0;margin:0;text-align:right">Today's Date</p><p class="heading-sub12" id="todayDate" style="padding:0;margin:0;text-align:right"></p></td><td width="10%"><button class="btn-label" style="display:flex;justify-content:center;align-items:center"><img src="../img/calendar.svg" width="100%"></button></td></tr>
<tr><td colspan="4"><div style="display:flex;margin:40px 0 15px 45px;align-items:center"><div class="heading-main12" style="font-size:20px;color:#313131">Schedule a Session</div><button id="addSessionBtn" type="button" class="login-btn btn-primary btn button-icon" style="margin-left:25px;background-image:url('../img/icons/add.svg')">Add a Session</button></div>
<div id="sessionForm" class="session-form"><h3 id="formTitle">Add Session</h3><input id="sessionTitle" placeholder="Session title"><select id="sessionDoctor"><option value="">Choose Doctor</option></select><input id="sessionDate" type="date"><input id="sessionTime" type="time"><input id="sessionNop" type="number" min="1" placeholder="Maximum bookings"><button id="saveSession" class="login-btn btn-primary btn">Save Session</button> <button id="cancelForm" type="button" class="login-btn btn-primary-soft btn">Cancel</button></div></td></tr>
<tr><td colspan="4" style="padding-top:10px"><p class="heading-main12" style="margin-left:45px;font-size:18px;color:#313131">All Sessions (<span id="count">0</span>)</p></td></tr>
<tr><td colspan="4"><center><table class="filter-container" border="0"><tr><td>Date:</td><td><input type="date" id="filterDate" class="input-text filter-container-items" style="margin:0;width:95%"></td><td>Doctor:</td><td><select id="filterDoctor" class="box filter-container-items" style="width:90%;height:37px;margin:0"><option value="">All Doctors</option></select></td><td><button id="filterBtn" class="btn-primary-soft btn button-icon btn-filter" style="padding:15px;margin:0;width:100%">Filter</button></td></tr></table></center></td></tr>
<tr><td colspan="4"><center><div class="abc scroll"><table width="93%" class="sub-table scrolldown" border="0"><thead><tr><th class="table-headin">Session Title</th><th class="table-headin">Doctor</th><th class="table-headin">Scheduled Date &amp; Time</th><th class="table-headin">Max Bookings</th><th class="table-headin">Booked</th><th class="table-headin">Events</th></tr></thead><tbody id="sessionsBody"><tr><td colspan="6" class="msg">Loading sessions...</td></tr></tbody></table></div></center></td></tr></table></div></div>
<script>
const api=window.adminApi;let editingId=null,doctors=[];
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function loadDoctors(){const {response,data}=await api.fetchJSON(api.API_BASE+'/doctors');if(response.ok&&data.success){doctors=data.doctors||[];const s=document.getElementById('sessionDoctor'),f=document.getElementById('filterDoctor');doctors.forEach(d=>{s.insertAdjacentHTML('beforeend',`<option value="${d.docid}">${esc(d.docname)}</option>`);f.insertAdjacentHTML('beforeend',`<option value="${d.docid}">${esc(d.docname)}</option>`);});}}
async function loadSessions(){const q=new URLSearchParams();if(filterDate.value)q.set('date',filterDate.value);if(filterDoctor.value)q.set('docid',filterDoctor.value);const {response,data}=await api.fetchJSON(api.API_BASE+'/schedules?'+q);if(!response.ok||!data.success){sessionsBody.innerHTML=`<tr><td colspan="6" class="msg">${esc(data.message||'Unable to load sessions')}</td></tr>`;return;}const rows=data.schedules||[];count.textContent=rows.length;sessionsBody.innerHTML=rows.length?rows.map(s=>`<tr><td class="table-data">${esc(s.title)}</td><td class="table-data">${esc(s.docname||'Not assigned')}</td><td class="table-data">${esc(s.scheduledate)}<br>${esc(s.scheduletime)}</td><td class="table-data">${s.nop}</td><td class="table-data">${s.bookedSeats||0}</td><td class="table-data"><button class="login-btn btn-primary-soft btn" onclick="editSession(${s.scheduleid})">Edit</button> <button class="login-btn btn-primary-soft btn" onclick="deleteSession(${s.scheduleid})">Delete</button></td></tr>`).join(''):`<tr><td colspan="6" class="msg">No sessions found</td></tr>`;}
async function editSession(id){const {response,data}=await api.fetchJSON(api.API_BASE+'/schedules');if(!response.ok||!data.success)return;const s=(data.schedules||[]).find(x=>Number(x.scheduleid)===Number(id));if(!s)return;editingId=id;sessionTitle.value=s.title;sessionDoctor.value=s.docid;sessionDate.value=String(s.scheduledate).slice(0,10);sessionTime.value=String(s.scheduletime).slice(0,5);sessionNop.value=s.nop;formTitle.textContent='Edit Session';sessionForm.classList.add('show');}
async function deleteSession(id){if(!confirm('Delete this session? Existing bookings for it will also be deleted.'))return;const {response,data}=await api.fetchJSON(api.API_BASE+'/schedules/'+id,{method:'DELETE'});alert(data.message||'');if(response.ok&&data.success)loadSessions();}
addSessionBtn.onclick=()=>{editingId=null;formTitle.textContent='Add Session';sessionTitle.value='';sessionDoctor.value='';sessionDate.value='';sessionTime.value='';sessionNop.value='';sessionForm.classList.add('show');};cancelForm.onclick=()=>sessionForm.classList.remove('show');filterBtn.onclick=loadSessions;
saveSession.onclick=async()=>{const body={title:sessionTitle.value.trim(),docid:sessionDoctor.value,scheduledate:sessionDate.value,scheduletime:sessionTime.value,nop:sessionNop.value};const url=editingId?api.API_BASE+'/schedules/'+editingId:api.API_BASE+'/schedules';const {response,data}=await api.fetchJSON(url,{method:editingId?'PUT':'POST',body});alert(data.message||'');if(response.ok&&data.success){sessionForm.classList.remove('show');loadSessions();}};
document.getElementById('logoutBtn').onclick=api.logout;loadDoctors().then(loadSessions);
</script>
</body></html>
