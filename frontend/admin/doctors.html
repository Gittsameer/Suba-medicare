<script src="admin-common.js"></script>


<script>

"use strict";


/* =====================================================
   API
   ===================================================== */

const API_BASE =
    "https://backend-theta-ivory-38.vercel.app/api/admin";

const token =
    localStorage.getItem("token");


/* =====================================================
   LOGOUT
   ===================================================== */

function logoutAdmin() {

    localStorage.removeItem("token");
    localStorage.removeItem("userRole");
    localStorage.removeItem("userEmail");

    window.location.href =
        "../login.html";
}


if (!token) {

    logoutAdmin();

}


/* =====================================================
   API REQUEST
   ===================================================== */

async function adminRequest(
    endpoint,
    options = {}
) {

    const headers = {
        Authorization:
            "Bearer " + token
    };


    if (options.body) {

        headers["Content-Type"] =
            "application/json";

    }


    const response =
        await fetch(
            API_BASE + endpoint,
            {
                ...options,
                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );


    let data = {};

    try {

        data =
            await response.json();

    } catch (error) {

        data = {};

    }


    if (
        response.status === 401 ||
        response.status === 403
    ) {

        logoutAdmin();

        throw new Error(
            "AUTH_EXPIRED"
        );

    }


    if (!response.ok ||
        data.success === false) {

        throw new Error(
            data.message ||
            "Request failed"
        );

    }


    return data;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   TODAY DATE
   ===================================================== */

function setTodayDate() {

    const element =
        document.getElementById(
            "todayDate"
        );

    if (!element) return;


    element.textContent =
        new Date().toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );

}


/* =====================================================
   LOAD DOCTORS
   ===================================================== */

async function loadDoctors() {

    const body =
        document.getElementById(
            "doctorsBody"
        );


    body.innerHTML = `

        <tr>

            <td
                colspan="4"
                class="loading-row">

                Loading doctors...

            </td>

        </tr>

    `;


    try {

        /*
         * Expected backend:
         *
         * GET /api/admin/doctors
         *
         * {
         *   success: true,
         *   doctors: [...]
         * }
         */

        const data =
            await adminRequest(
                "/doctors"
            );


        console.log(
            "Admin doctors response:",
            data
        );


        const doctors =
            Array.isArray(
                data.doctors
            )
                ? data.doctors
                : [];


        document.getElementById(
            "doctorCount"
        ).textContent =
            `All Doctors (${doctors.length})`;


        if (!doctors.length) {

            body.innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="empty-row">

                        No doctors found.

                    </td>

                </tr>

            `;

            return;

        }


        renderDoctors(
            doctors
        );


    } catch (error) {

        console.error(
            "Doctor loading error:",
            error
        );


        if (
            error.message ===
            "AUTH_EXPIRED"
        ) {

            return;

        }


        body.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="error-row">

                    ${escapeHTML(
                        error.message ||
                        "Unable to load doctors."
                    )}

                </td>

            </tr>

        `;

    }

}


/* =====================================================
   RENDER DOCTORS
   ===================================================== */

function renderDoctors(doctors) {

    const body =
        document.getElementById(
            "doctorsBody"
        );


    body.innerHTML =
        doctors.map(
            doctor => {

                const id =
                    Number(
                        doctor.docid
                    );


                return `

                    <tr>

                        <td class="table-data">

                            ${escapeHTML(
                                doctor.docname ||
                                "-"
                            )}

                        </td>


                        <td class="table-data">

                            ${escapeHTML(
                                doctor.docemail ||
                                "-"
                            )}

                        </td>


                        <td class="table-data">

                            ${escapeHTML(
                                doctor.specialty ||
                                doctor.sname ||
                                doctor.specialties ||
                                "-"
                            )}

                        </td>


                        <td class="table-data doctor-actions">

                            <button
                                class="login-btn btn-primary-soft btn"
                                onclick="viewDoctor(${id})">

                                View

                            </button>


                            <button
                                class="login-btn btn-primary-soft btn"
                                onclick="deleteDoctor(${id})">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;

            }
        ).join("");

}


/* =====================================================
   SEARCH
   ===================================================== */

let allDoctors = [];


function searchDoctors() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
            .trim()
            .toLowerCase();


    if (!search) {

        renderDoctors(
            allDoctors
        );

        return;

    }


    const filtered =
        allDoctors.filter(
            doctor => {

                const name =
                    String(
                        doctor.docname || ""
                    ).toLowerCase();


                const email =
                    String(
                        doctor.docemail || ""
                    ).toLowerCase();


                return (
                    name.includes(search) ||
                    email.includes(search)
                );

            }
        );


    renderDoctors(
        filtered
    );

}


/* =====================================================
   VIEW DOCTOR
   ===================================================== */

async function viewDoctor(id) {

    if (!id) return;


    try {

        const data =
            await adminRequest(
                `/doctors/${id}`
            );


        const doctor =
            data.doctor || {};


        alert(
            "Doctor: " +
            (doctor.docname || "-") +
            "\nEmail: " +
            (doctor.docemail || "-") +
            "\nNIC: " +
            (doctor.docnic || "-") +
            "\nTelephone: " +
            (doctor.doctel || "-")
        );


    } catch (error) {

        if (
            error.message !==
            "AUTH_EXPIRED"
        ) {

            alert(
                error.message
            );

        }

    }

}


/* =====================================================
   DELETE DOCTOR
   ===================================================== */

async function deleteDoctor(id) {

    if (!id) return;


    if (
        !confirm(
            "Are you sure you want to delete this doctor?"
        )
    ) {

        return;

    }


    try {

        const data =
            await adminRequest(
                `/doctors/${id}`,
                {
                    method:"DELETE"
                }
            );


        alert(
            data.message ||
            "Doctor deleted successfully."
        );


        await loadDoctors();


    } catch (error) {

        if (
            error.message !==
            "AUTH_EXPIRED"
        ) {

            alert(
                error.message
            );

        }

    }

}


/* =====================================================
   INITIALIZE
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        setTodayDate();


        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                logoutAdmin
            );


        document
            .getElementById(
                "searchForm"
            )
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    searchDoctors();

                }
            );


        try {

            const data =
                await adminRequest(
                    "/doctors"
                );


            allDoctors =
                Array.isArray(
                    data.doctors
                )
                    ? data.doctors
                    : [];


            document.getElementById(
                "doctorCount"
            ).textContent =
                `All Doctors (${allDoctors.length})`;


            renderDoctors(
                allDoctors
            );


        } catch (error) {

            console.error(
                error
            );


            if (
                error.message !==
                "AUTH_EXPIRED"
            ) {

                document.getElementById(
                    "doctorsBody"
                ).innerHTML = `

                    <tr>

                        <td
                            colspan="4"
                            class="error-row">

                            ${escapeHTML(
                                error.message
                            )}

                        </td>

                    </tr>

                `;

            }

        }

    }
);

</script>
