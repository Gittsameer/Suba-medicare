<script src="admin-common.js"></script>


<script>

"use strict";


/* =====================================================
   API
===================================================== */

const API_BASE_URL =
    "http://localhost:5000/api/admin";

const token =
    localStorage.getItem("token");


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("userRole");
    localStorage.removeItem("userEmail");

    window.location.href =
        "../login.html";
}


if (!token) {

    logout();

}


/* =====================================================
   AUTH HEADERS
===================================================== */

function authHeaders(json = false) {

    const headers = {
        Authorization:
            "Bearer " + token
    };

    if (json) {

        headers["Content-Type"] =
            "application/json";

    }

    return headers;
}


/* =====================================================
   API REQUEST
===================================================== */

async function api(
    path,
    options = {}
) {

    const response =
        await fetch(
            API_BASE_URL + path,
            {
                ...options,

                headers: {
                    ...authHeaders(
                        !!options.body
                    ),

                    ...(options.headers || {})
                }
            }
        );


    let data = {};

    try {

        data =
            await response.json();

    } catch (error) {

        data = {};

    }


    if (
        response.status === 401 ||
        response.status === 403
    ) {

        alert(
            data.message ||
            "Session expired. Please login again."
        );

        logout();

        throw new Error(
            "AUTH_EXPIRED"
        );

    }


    if (!response.ok ||
        data.success === false) {

        throw new Error(
            data.message ||
            "Request failed"
        );

    }


    return data;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value) {

    if (!value) {

        return "-";

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return String(value);

    }


    return date.toLocaleDateString(
        "en-GB"
    );

}


/* =====================================================
   VARIABLES
===================================================== */

let allPatients = [];


/* =====================================================
   TODAY DATE
===================================================== */

function setTodayDate() {

    const element =
        document.getElementById(
            "todayDate"
        );


    if (!element) return;


    element.textContent =
        new Date().toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );

}


/* =====================================================
   LOAD ADMIN PROFILE
===================================================== */

async function loadProfile() {

    try {

        const data =
            await api("/profile");


        if (
            data.admin &&
            data.admin.aemail
        ) {

            const email =
                data.admin.aemail;


            const name =
                email.split("@")[0];


            const nameElement =
                document.getElementById(
                    "adminName"
                );


            const emailElement =
                document.getElementById(
                    "adminEmail"
                );


            if (nameElement) {

                nameElement.textContent =
                    name ||
                    "Administrator";

            }


            if (emailElement) {

                emailElement.textContent =
                    email;

            }

        }

    } catch (error) {

        if (
            error.message !==
            "AUTH_EXPIRED"
        ) {

            console.error(
                "Profile error:",
                error
            );

        }

    }

}


/* =====================================================
   LOAD PATIENTS
===================================================== */

async function loadPatients(
    search = ""
) {

    const body =
        document.getElementById(
            "patientsBody"
        );


    body.innerHTML = `

        <tr>

            <td
                colspan="6"
                class="loading-row"
            >

                Loading patients...

            </td>

        </tr>

    `;


    try {

        let url =
            "/patients";


        if (search) {

            url +=
                "?search=" +
                encodeURIComponent(
                    search
                );

        }


        const data =
            await api(url);


        allPatients =
            Array.isArray(
                data.patients
            )
                ? data.patients
                : [];


        renderPatients(
            allPatients
        );


    } catch (error) {

        console.error(
            "Patient loading error:",
            error
        );


        if (
            error.message ===
            "AUTH_EXPIRED"
        ) {

            return;

        }


        body.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="error-row"
                >

                    ${escapeHTML(
                        error.message ||
                        "Unable to load patients."
                    )}

                </td>

            </tr>

        `;

    }

}


/* =====================================================
   RENDER PATIENTS
===================================================== */

function renderPatients(
    patients
) {

    const body =
        document.getElementById(
            "patientsBody"
        );


    const count =
        document.getElementById(
            "patientCount"
        );


    count.textContent =
        `All Patients (${patients.length})`;


    if (!patients.length) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty-row"
                >

                    No patients found.

                </td>

            </tr>

        `;

        return;

    }


    body.innerHTML =
        patients.map(
            patient => {

                return `

                    <tr>

                        <!-- NAME -->

                        <td class="table-data">

                            ${escapeHTML(
                                patient.pname ||
                                "-"
                            )}

                        </td>


                        <!-- NIC -->

                        <td class="table-data">

                            ${escapeHTML(
                                patient.pnic ||
                                "-"
                            )}

                        </td>


                        <!-- TELEPHONE -->

                        <td class="table-data">

                            ${escapeHTML(
                                patient.ptel ||
                                "-"
                            )}

                        </td>


                        <!-- EMAIL -->

                        <td class="table-data">

                            ${escapeHTML(
                                patient.pemail ||
                                "-"
                            )}

                        </td>


                        <!-- DOB -->

                        <td class="table-data">

                            ${escapeHTML(
                                formatDate(
                                    patient.pdob
                                )
                            )}

                        </td>


                        <!-- EVENTS -->

                        <td class="table-data patient-actions">

                            <button
                                type="button"
                                class="login-btn btn-primary-soft btn"
                                onclick="viewPatient(${Number(
                                    patient.pid
                                )})"
                            >

                                View

                            </button>

                        </td>

                    </tr>

                `;

            }
        ).join("");

}


/* =====================================================
   VIEW PATIENT
===================================================== */

async function viewPatient(pid) {
    if (!pid) {
        alert("Invalid patient ID.");
        return;
    }

    const patient = allPatients.find(
        p => Number(p.pid) === Number(pid)
    );

    if (!patient) {
        alert("Patient details not found.");
        return;
    }

    alert(
        "Patient Details\n\n" +
        "Name: " + (patient.pname || "-") +
        "\nEmail: " + (patient.pemail || "-") +
        "\nNIC: " + (patient.pnic || "-") +
        "\nTelephone: " + (patient.ptel || "-") +
        "\nDate of Birth: " + formatDate(patient.pdob) +
        "\nAddress: " + (patient.paddress || "-")
    );
}


/* =====================================================
   SEARCH FORM
===================================================== */

document
    .getElementById(
        "searchForm"
    )
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const search =
                document.getElementById(
                    "searchInput"
                ).value.trim();


            loadPatients(
                search
            );

        }
    );


/* =====================================================
   LOGOUT
===================================================== */

document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        logout
    );


/* =====================================================
   INITIALIZE
===================================================== */

async function init() {

    if (!token) {

        return;

    }


    setTodayDate();

    await loadProfile();

    await loadPatients();

}


init();

</script>
