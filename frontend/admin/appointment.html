<script src="admin-common.js"></script>


<script>

"use strict";


/* =====================================================
   API
===================================================== */

const API_BASE_URL =
    "https://backend-theta-ivory-38.vercel.app/api/admin";

const token =
    localStorage.getItem("token");


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("userRole");
    localStorage.removeItem("userEmail");

    window.location.href =
        "../login.html";
}


/* =====================================================
   AUTH HEADERS
===================================================== */

function authHeaders(json = false) {

    const headers = {
        Authorization:
            "Bearer " + token
    };

    if (json) {

        headers["Content-Type"] =
            "application/json";
    }

    return headers;
}


/* =====================================================
   API REQUEST
===================================================== */

async function api(path, options = {}) {

    const response =
        await fetch(
            API_BASE_URL + path,
            {
                ...options,

                headers: {
                    ...authHeaders(
                        !!options.body
                    ),

                    ...(options.headers || {})
                }
            }
        );


    let data = {};

    try {

        data =
            await response.json();

    } catch (error) {

        data = {};
    }


    if (
        response.status === 401 ||
        response.status === 403
    ) {

        alert(
            data.message ||
            "Session expired. Please login again."
        );

        logout();

        throw new Error(
            "AUTH_EXPIRED"
        );
    }


    if (!response.ok) {

        throw new Error(
            data.message ||
            "Request failed"
        );
    }


    if (data.success === false) {

        throw new Error(
            data.message ||
            "Request failed"
        );
    }


    return data;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value) {

    if (!value) {
        return "-";
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {

        return String(value);
    }

    return date.toLocaleDateString(
        "en-GB"
    );
}


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(value) {

    if (!value) {
        return "-";
    }

    return String(value)
        .substring(0, 5);
}


/* =====================================================
   VARIABLES
===================================================== */

let allAppointments = [];


/* =====================================================
   TODAY DATE
===================================================== */

function setTodayDate() {

    const element =
        document.getElementById(
            "todayDate"
        );

    if (!element) return;

    element.textContent =
        new Date().toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );
}


/* =====================================================
   LOAD ADMIN PROFILE
===================================================== */

async function loadProfile() {

    try {

        const data =
            await api("/profile");


        if (
            data.admin &&
            data.admin.aemail
        ) {

            const email =
                data.admin.aemail;

            const name =
                email.split("@")[0];


            const nameElement =
                document.getElementById(
                    "adminName"
                );

            const emailElement =
                document.getElementById(
                    "adminEmail"
                );


            if (nameElement) {

                nameElement.textContent =
                    name ||
                    "Administrator";
            }


            if (emailElement) {

                emailElement.textContent =
                    email;
            }

        }

    } catch (error) {

        if (
            error.message !==
            "AUTH_EXPIRED"
        ) {

            console.error(
                "Profile error:",
                error
            );
        }
    }
}


/* =====================================================
   LOAD APPOINTMENTS
===================================================== */

async function loadAppointments(
    date = ""
) {

    const body =
        document.getElementById(
            "appointmentsBody"
        );


    body.innerHTML = `
        <tr>
            <td colspan="7" class="loading">
                Loading appointments...
            </td>
        </tr>
    `;


    try {

        let url =
            "/appointments";


        if (date) {

            url +=
                "?date=" +
                encodeURIComponent(date);
        }


        const data =
            await api(url);


        allAppointments =
            Array.isArray(
                data.appointments
            )
                ? data.appointments
                : [];


        renderAppointments(
            allAppointments
        );


    } catch (error) {

        console.error(
            "Appointment loading error:",
            error
        );


        if (
            error.message ===
            "AUTH_EXPIRED"
        ) {

            return;
        }


        body.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="error-message"
                >
                    ${escapeHtml(
                        error.message ||
                        "Unable to load appointments"
                    )}
                </td>
            </tr>
        `;

    }

}


/* =====================================================
   RENDER APPOINTMENTS
===================================================== */

function renderAppointments(
    appointments
) {

    const body =
        document.getElementById(
            "appointmentsBody"
        );


    const count =
        document.getElementById(
            "appointmentCount"
        );


    count.textContent =
        `All Appointments (${appointments.length})`;


    if (!appointments.length) {

        body.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="empty-message"
                >
                    No appointments found
                </td>
            </tr>
        `;

        return;
    }


    body.innerHTML =
        appointments.map(
            appointment => {

                const patientName =
                    appointment.pname ||
                    "-";


                const doctorName =
                    appointment.docname ||
                    "-";


                const doctorEmail =
                    appointment.docemail ||
                    "";


                const sessionTitle =
                    appointment.title ||
                    "-";


                const sessionDate =
                    formatDate(
                        appointment.scheduledate
                    );


                const sessionTime =
                    formatTime(
                        appointment.scheduletime
                    );


                const appointmentDate =
                    formatDate(
                        appointment.appodate
                    );


                const appointmentNumber =
                    appointment.apponum ??
                    "-";


                return `
                    <tr>

                        <td class="table-data">
                            ${escapeHtml(
                                patientName
                            )}
                            ${
                                appointment.pemail
                                    ? `
                                        <br>
                                        <small>
                                            ${escapeHtml(
                                                appointment.pemail
                                            )}
                                        </small>
                                      `
                                    : ""
                            }
                        </td>


                        <td class="table-data">
                            ${escapeHtml(
                                appointmentNumber
                            )}
                        </td>


                        <td class="table-data">
                            ${escapeHtml(
                                doctorName
                            )}
                            ${
                                doctorEmail
                                    ? `
                                        <br>
                                        <small>
                                            ${escapeHtml(
                                                doctorEmail
                                            )}
                                        </small>
                                      `
                                    : ""
                            }
                        </td>


                        <td class="table-data">
                            ${escapeHtml(
                                sessionTitle
                            )}
                        </td>


                        <td class="table-data">
                            ${escapeHtml(
                                sessionDate
                            )}
                            <br>
                            ${escapeHtml(
                                sessionTime
                            )}
                        </td>


                        <td class="table-data">
                            ${escapeHtml(
                                appointmentDate
                            )}
                        </td>


                        <td class="table-data">

                            <button
                                type="button"
                                class="login-btn btn-primary-soft btn delete-btn"
                                onclick="deleteAppointment(${Number(
                                    appointment.appoid
                                )})"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>
                `;
            }
        ).join("");
}


/* =====================================================
   DELETE APPOINTMENT
===================================================== */

async function deleteAppointment(
    appoid
) {

    if (!appoid) {

        alert(
            "Invalid appointment ID"
        );

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this appointment?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const data =
            await api(
                `/appointments/${appoid}`,
                {
                    method: "DELETE"
                }
            );


        alert(
            data.message ||
            "Appointment deleted successfully"
        );


        const selectedDate =
            document.getElementById(
                "dateFilter"
            ).value;


        await loadAppointments(
            selectedDate
        );


    } catch (error) {

        if (
            error.message !==
            "AUTH_EXPIRED"
        ) {

            alert(
                error.message ||
                "Unable to delete appointment"
            );
        }

    }

}


/* =====================================================
   FILTER
===================================================== */

document
    .getElementById("filterButton")
    .addEventListener(
        "click",
        () => {

            const date =
                document.getElementById(
                    "dateFilter"
                ).value;


            loadAppointments(
                date
            );
        }
    );


/* =====================================================
   CLEAR FILTER
===================================================== */

document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        () => {

            document.getElementById(
                "dateFilter"
            ).value = "";


            loadAppointments();
        }
    );


/* =====================================================
   LOGOUT BUTTON
===================================================== */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        logout
    );


/* =====================================================
   INITIALIZE
===================================================== */

async function init() {

    if (!token) {

        window.location.href =
            "../login.html";

        return;
    }


    setTodayDate();

    await loadProfile();

    await loadAppointments();
}


init();

</script>
