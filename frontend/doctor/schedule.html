    <!-- =====================================================

<script>

"use strict";


/* =====================================================
   CONFIG
   ===================================================== */

const API_BASE_URL =
    "https://backend-theta-ivory-38.vercel.app/api/doctor";

const token =
    localStorage.getItem("token");


/* =====================================================
   AUTH
   ===================================================== */

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("userRole");
    localStorage.removeItem("userEmail");

    window.location.href =
        "../login.html";
}


if (!token) {

    window.location.href =
        "../login.html";

}


/* =====================================================
   API
   ===================================================== */

async function api(endpoint, options = {}) {

    const headers = {
        Authorization:
            "Bearer " + token
    };


    if (options.body) {

        headers["Content-Type"] =
            "application/json";

    }


    const response =
        await fetch(
            API_BASE_URL + endpoint,
            {
                ...options,
                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );


    let data = {};

    try {

        data =
            await response.json();

    } catch (error) {

        data = {};

    }


    if (
        response.status === 401 ||
        response.status === 403
    ) {

        logout();

        throw new Error(
            "AUTH_EXPIRED"
        );

    }


    if (!response.ok ||
        data.success === false) {

        throw new Error(
            data.message ||
            "Request failed"
        );

    }


    return data;

}


/* =====================================================
   DATE
   ===================================================== */

function setTodayDate() {

    const element =
        document.getElementById(
            "todayDate"
        );

    if (!element) return;


    element.textContent =
        new Date().toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   DATE FORMAT
   ===================================================== */

function formatDate(value) {

    if (!value) {
        return "-";
    }


    const text =
        String(value)
            .substring(0, 10);


    const parts =
        text.split("-");


    if (parts.length !== 3) {
        return "-";
    }


    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );


    if (isNaN(date.getTime())) {
        return "-";
    }


    return date.toLocaleDateString(
        "en-GB"
    );

}


/* =====================================================
   LOAD DOCTOR PROFILE
   ===================================================== */

async function loadProfile() {

    try {

        const data =
            await api("/profile");


        const doctor =
            data.doctor || {};


        document.getElementById(
            "profileName"
        ).textContent =
            doctor.docname ||
            "Doctor";


        document.getElementById(
            "profileEmail"
        ).textContent =
            doctor.docemail ||
            "";

    } catch (error) {

        if (
            error.message !==
            "AUTH_EXPIRED"
        ) {

            console.error(
                "Profile error:",
                error
            );

        }

    }

}


/* =====================================================
   SESSION DATA
   ===================================================== */

let sessions = [];


/* =====================================================
   RENDER SESSIONS
   ===================================================== */

function renderSessions(list) {

    const body =
        document.getElementById(
            "sessionsBody"
        );


    const count =
        document.getElementById(
            "sessionCount"
        );


    count.textContent =
        `My Sessions (${list.length})`;


    if (!list.length) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty-row">

                    No sessions found.

                </td>

            </tr>

        `;

        return;

    }


    body.innerHTML =
        list.map(session => {

            const id =
                Number(
                    session.scheduleid
                );


            return `

                <tr>

                    <td class="table-data">

                        ${escapeHTML(
                            session.title || "-"
                        )}

                    </td>


                    <td class="table-data">

                        ${formatDate(
                            session.scheduledate
                        )}

                        <br>

                        ${escapeHTML(
                            String(
                                session.scheduletime ||
                                "-"
                            ).substring(0, 5)
                        )}

                    </td>


                    <td class="table-data">

                        ${escapeHTML(
                            session.nop ?? "-"
                        )}

                    </td>


                    <td class="table-data session-actions">

                        <button
                            class="login-btn btn-primary-soft btn"
                            data-edit-id="${id}">

                            Edit

                        </button>


                        <button
                            class="login-btn btn-primary-soft btn"
                            data-delete-id="${id}">

                            Delete

                        </button>

                    </td>

                </tr>

            `;

        }).join("");


    /* EDIT */

    body.querySelectorAll(
        "[data-edit-id]"
    ).forEach(button => {

        button.addEventListener(
            "click",
            function () {

                const id =
                    Number(
                        this.dataset.editId
                    );


                const session =
                    sessions.find(
                        item =>
                            Number(
                                item.scheduleid
                            ) === id
                    );


                if (session) {
                    openForm(session);
                }

            }
        );

    });


    /* DELETE */

    body.querySelectorAll(
        "[data-delete-id]"
    ).forEach(button => {

        button.addEventListener(
            "click",
            function () {

                deleteSession(
                    Number(
                        this.dataset.deleteId
                    )
                );

            }
        );

    });

}


/* =====================================================
   LOAD SESSIONS
   ===================================================== */

async function loadSessions() {

    const body =
        document.getElementById(
            "sessionsBody"
        );


    body.innerHTML = `

        <tr>

            <td
                colspan="4"
                class="loading-row">

                Loading sessions...

            </td>

        </tr>

    `;


    try {

        /*
         * Backend:
         * GET /api/doctor/schedules
         *
         * Response:
         * {
         *   success: true,
         *   schedules: [...]
         * }
         */

        const data =
            await api("/schedules");


        sessions =
            Array.isArray(
                data.schedules
            )
                ? data.schedules
                : [];


        renderSessions(
            sessions
        );


    } catch (error) {

        console.error(
            "Load sessions error:",
            error
        );


        if (
            error.message ===
            "AUTH_EXPIRED"
        ) {

            return;

        }


        body.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="error-row">

                    ${escapeHTML(
                        error.message ||
                        "Unable to load sessions."
                    )}

                </td>

            </tr>

        `;

    }

}


/* =====================================================
   OPEN FORM
   ===================================================== */

function openForm(session = null) {

    document.getElementById(
        "formRow"
    ).style.display =
        "table-row";


    document.getElementById(
        "scheduleid"
    ).value =
        session
            ? session.scheduleid
            : "";


    document.getElementById(
        "title"
    ).value =
        session
            ? session.title || ""
            : "";


    document.getElementById(
        "scheduledate"
    ).value =
        session
            ? String(
                session.scheduledate || ""
            ).substring(0, 10)
            : "";


    document.getElementById(
        "scheduletime"
    ).value =
        session
            ? String(
                session.scheduletime || ""
            ).substring(0, 5)
            : "";


    document.getElementById(
        "nop"
    ).value =
        session
            ? session.nop ?? ""
            : "";

}


/* =====================================================
   CLOSE FORM
   ===================================================== */

function closeForm() {

    document.getElementById(
        "formRow"
    ).style.display =
        "none";


    document.getElementById(
        "sessionForm"
    ).reset();


    document.getElementById(
        "scheduleid"
    ).value = "";

}


/* =====================================================
   SAVE SESSION
   ===================================================== */

async function saveSession(event) {

    event.preventDefault();


    const scheduleid =
        document.getElementById(
            "scheduleid"
        ).value;


    const title =
        document.getElementById(
            "title"
        ).value.trim();


    const scheduledate =
        document.getElementById(
            "scheduledate"
        ).value;


    const scheduletime =
        document.getElementById(
            "scheduletime"
        ).value;


    const nop =
        Number(
            document.getElementById(
                "nop"
            ).value
        );


    if (
        !title ||
        !scheduledate ||
        !scheduletime ||
        !Number.isInteger(nop) ||
        nop <= 0
    ) {

        alert(
            "Please enter all session details correctly."
        );

        return;

    }


    try {

        const endpoint =
            scheduleid
                ? `/schedules/${scheduleid}`
                : "/schedules";


        const method =
            scheduleid
                ? "PUT"
                : "POST";


        const data =
            await api(
                endpoint,
                {
                    method,

                    body:
                        JSON.stringify({
                            title,
                            scheduledate,
                            scheduletime,
                            nop
                        })
                }
            );


        alert(
            data.message ||
            "Session saved successfully."
        );


        closeForm();


        await loadSessions();


    } catch (error) {

        if (
            error.message !==
            "AUTH_EXPIRED"
        ) {

            alert(
                error.message ||
                "Unable to save session."
            );

        }

    }

}


/* =====================================================
   DELETE SESSION
   ===================================================== */

async function deleteSession(id) {

    if (!id) {
        return;
    }


    if (
        !confirm(
            "Delete this session?"
        )
    ) {

        return;

    }


    try {

        const data =
            await api(
                `/schedules/${id}`,
                {
                    method: "DELETE"
                }
            );


        alert(
            data.message ||
            "Session deleted successfully."
        );


        await loadSessions();


    } catch (error) {

        if (
            error.message !==
            "AUTH_EXPIRED"
        ) {

            alert(
                error.message ||
                "Unable to delete session."
            );

        }

    }

}


/* =====================================================
   FILTER
   ===================================================== */

function filterSessions() {

    const date =
        document.getElementById(
            "filterDate"
        ).value;


    if (!date) {

        renderSessions(
            sessions
        );

        return;

    }


    const filtered =
        sessions.filter(
            session =>
                String(
                    session.scheduledate || ""
                ).substring(0, 10) === date
        );


    renderSessions(
        filtered
    );

}


/* =====================================================
   INITIALIZE
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        setTodayDate();


        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                logout
            );


        document
            .getElementById(
                "addSessionBtn"
            )
            .addEventListener(
                "click",
                () => openForm()
            );


        document
            .getElementById(
                "cancelForm"
            )
            .addEventListener(
                "click",
                closeForm
            );


        document
            .getElementById(
                "sessionForm"
            )
            .addEventListener(
                "submit",
                saveSession
            );


        document
            .getElementById(
                "filterBtn"
            )
            .addEventListener(
                "click",
                filterSessions
            );


        document
            .getElementById(
                "clearBtn"
            )
            .addEventListener(
                "click",
                function () {

                    document.getElementById(
                        "filterDate"
                    ).value = "";


                    renderSessions(
                        sessions
                    );

                }
            );


        await loadProfile();

        await loadSessions();

    }
);

</script>

</body>
