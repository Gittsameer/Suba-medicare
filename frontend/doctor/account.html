            <tr class="menu-row">

                </td>
            </tr>


            <tr class="menu-row">

            </tr>


            <tr class="menu-row">

    <!-- ================= MAIN ================= -->

    <div class="dash-body">

        <table
            border="0"
            width="100%"
            style="border-spacing:0;margin:0;padding:0;margin-top:25px;">

            <tr>

                <td width="13%">

                    <a href="settings.html">

                        <button
                            class="login-btn btn-primary-soft btn btn-icon-back"
                            style="padding:11px;margin-left:20px;width:125px;">

                </td>

                <td>

                    <p

                </td>

                <td width="15%">

                    <p

                        Today's Date

                    </p>

                    <p
                        id="todayDate"

                    </p>

                </td>

                <td width="10%">

                    <button class="btn-label">

                        <img
                            src="../img/calendar.svg"
                            width="100%">

                    </button>

                </td>

            </tr>


            <tr>

                <td colspan="4">

                    <center>

                        <div
                            class="filter-container"
                            style="width:80%;margin-top:30px;padding:30px;">

                            <h2>
                                Doctor Account
                            </h2>

                            <br>

                            <table
                                width="80%"
                                border="0">

                                <tr>
                                    <td class="label-td">
                                        <b>Name:</b>
                                    </td>

                                    <td
                                        class="label-td"
                                        id="doctorName">
                                        Loading...
                                    </td>
                                </tr>

                                <tr>
                                    <td class="label-td">
                                        <b>Email:</b>
                                    </td>

                                    <td
                                        class="label-td"
                                        id="doctorEmail">
                                        Loading...
                                    </td>
                                </tr>

                                <tr>
                                    <td class="label-td">
                                        <b>NIC:</b>
                                    </td>

                                    <td
                                        class="label-td"
                                        id="doctorNIC">
                                        Loading...
                                    </td>
                                </tr>

                                <tr>
                                    <td class="label-td">
                                        <b>Telephone:</b>
                                    </td>

                                    <td
                                        class="label-td"
                                        id="doctorTel">
                                        Loading...
                                    </td>
                                </tr>

                                <tr>
                                    <td class="label-td">
                                        <b>Specialty:</b>
                                    </td>

                                    <td
                                        class="label-td"
                                        id="doctorSpecialty">
                                        Loading...
                                    </td>
                                </tr>

                            </table>

                        </div>

                    </center>

                </td>

            </tr>

        </table>

    </div>

</div>


<script>

const API_BASE_URL =
    "https://backend-theta-ivory-38.vercel.app/api/doctor";

const token =
    localStorage.getItem("token");


function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("userRole");
    localStorage.removeItem("userEmail");

    window.location.href =
        "../login.html";
}


async function loadAccount() {

    if (!token) {

        logout();
        return;

    }

    try {

        const response = await fetch(
            `${API_BASE_URL}/profile`,
            {
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        const data =
            await response.json();


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            logout();
            return;

        }


        if (!response.ok || !data.success) {

            alert(
                data.message ||
                "Unable to load account."
            );

            return;

        }


        const doctor =
            data.doctor || {};


        document.getElementById(
            "doctorName"
        ).textContent =
            doctor.docname || "-";


        document.getElementById(
            "doctorEmail"
        ).textContent =
            doctor.docemail || "-";


        document.getElementById(
            "doctorNIC"
        ).textContent =
            doctor.docnic || "-";


        document.getElementById(
            "doctorTel"
        ).textContent =
            doctor.doctel || "-";


        document.getElementById(
            "doctorSpecialty"
        ).textContent =
            doctor.specialty ||
            doctor.sname ||
            doctor.specialties ||
            "-";


        document.getElementById(
            "profileName"
        ).textContent =
            doctor.docname || "Doctor";


        document.getElementById(
            "profileEmail"
        ).textContent =
            doctor.docemail || "";

    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to server."
        );

    }

}


document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    logout
);


document.getElementById(
    "todayDate"
).textContent =
    new Date().toLocaleDateString("en-GB");


loadAccount();

</script>

</body>
</html>
