<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin.css">

    <title>Change Password</title>

</head>

<body>

<div class="container">

    <!-- ================= MENU ================= -->

    <div class="menu">

        <table class="menu-container" border="0">

            <tr>

                <td style="padding:10px" colspan="2">

                    <table
                        class="profile-container"
                        border="0">

                        <tr>

                            <td
                                width="30%"
                                style="padding-left:20px">

                                <img
                                    src="../img/user.png"
                                    alt="Doctor"
                                    width="100%"
                                    style="border-radius:50%;">

                            </td>

                            <td style="padding:0">

                                <p
                                    class="profile-title"
                                    id="profileName">
                                    Loading...
                                </p>

                                <p
                                    class="profile-subtitle"
                                    id="profileEmail">
                                    Loading...
                                </p>

                            </td>

                        </tr>

                        <tr>

                            <td colspan="2">

                                <input
                                    type="button"
                                    value="Log out"
                                    id="logoutButton"
                                    class="logout-btn btn-primary-soft btn">

                            </td>

                        </tr>

                    </table>

                </td>

            </tr>


            <!-- DASHBOARD -->

            <tr class="menu-row">

                <td class="menu-btn menu-icon-dashbord">

                    <a
                        href="index.html"
                        class="non-style-link-menu">

                        <div>

                            <p class="menu-text">
                                Dashboard
                            </p>

                        </div>

                    </a>

                </td>

            </tr>


            <!-- APPOINTMENTS -->

            <tr class="menu-row">

                <td class="menu-btn menu-icon-appoinment">

                    <a
                        href="appointment.html"
                        class="non-style-link-menu">

                        <div>

                            <p class="menu-text">
                                My Appointments
                            </p>

                        </div>

                    </a>

                </td>

            </tr>


            <!-- SESSIONS -->

            <tr class="menu-row">

                <td class="menu-btn menu-icon-session">

                    <a
                        href="schedule.html"
                        class="non-style-link-menu">

                        <div>

                            <p class="menu-text">
                                My Sessions
                            </p>

                        </div>

                    </a>

                </td>

            </tr>


            <!-- PATIENTS -->

            <tr class="menu-row">

                <td class="menu-btn menu-icon-patient">

                    <a
                        href="patient.html"
                        class="non-style-link-menu">

                        <div>

                            <p class="menu-text">
                                My Patients
                            </p>

                        </div>

                    </a>

                </td>

            </tr>


            <!-- SETTINGS -->

            <tr class="menu-row">

                <td
                    class="menu-btn menu-icon-settings menu-active menu-icon-settings-active">

                    <a
                        href="settings.html"
                        class="non-style-link-menu non-style-link-menu-active">

                        <div>

                            <p class="menu-text">
                                Settings
                            </p>

                        </div>

                    </a>

                </td>

            </tr>

        </table>

    </div>


    <!-- ================= MAIN CONTENT ================= -->

    <div class="dash-body">

        <table
            border="0"
            width="100%"
            style="
                border-spacing:0;
                margin:0;
                padding:0;
                margin-top:25px;
            ">


            <!-- HEADER -->

            <tr>

                <td width="13%">

                    <a href="settings.html">

                        <button
                            class="login-btn btn-primary-soft btn btn-icon-back"
                            style="
                                padding-top:11px;
                                padding-bottom:11px;
                                margin-left:20px;
                                width:125px;
                            ">

                            Back

                        </button>

                    </a>

                </td>


                <td>

                    <p
                        style="
                            font-size:23px;
                            padding-left:12px;
                            font-weight:600;
                        ">

                        Change Password

                    </p>

                </td>


                <td width="15%">

                    <p
                        style="
                            font-size:14px;
                            color:rgb(119,119,119);
                            padding:0;
                            margin:0;
                            text-align:right;
                        ">

                        Today's Date

                    </p>

                    <p
                        class="heading-sub12"
                        id="todayDate"
                        style="
                            padding:0;
                            margin:0;
                            text-align:right;
                        ">

                    </p>

                </td>


                <td width="10%">

                    <button
                        type="button"
                        class="btn-label"
                        style="
                            display:flex;
                            justify-content:center;
                            align-items:center;
                        ">

                        <img
                            src="../img/calendar.svg"
                            width="100%"
                            alt="Calendar">

                    </button>

                </td>

            </tr>


            <!-- PASSWORD FORM -->

            <tr>

                <td colspan="4">

                    <center>

                        <div
                            class="filter-container"
                            style="
                                width:80%;
                                margin-top:30px;
                                padding:30px;
                            ">

                            <h2>
                                Change Password
                            </h2>

                            <br>


                            <form id="passwordForm">

                                <table
                                    width="80%"
                                    border="0">


                                    <!-- CURRENT PASSWORD -->

                                    <tr>

                                        <td class="label-td">

                                            <label for="currentPassword">
                                                Current Password:
                                            </label>

                                        </td>

                                        <td class="label-td">

                                            <input
                                                type="password"
                                                id="currentPassword"
                                                class="input-text"
                                                style="width:100%;"
                                                required>

                                        </td>

                                    </tr>


                                    <!-- NEW PASSWORD -->

                                    <tr>

                                        <td class="label-td">

                                            <label for="newPassword">
                                                New Password:
                                            </label>

                                        </td>

                                        <td class="label-td">

                                            <input
                                                type="password"
                                                id="newPassword"
                                                class="input-text"
                                                style="width:100%;"
                                                minlength="6"
                                                required>

                                        </td>

                                    </tr>


                                    <!-- CONFIRM PASSWORD -->

                                    <tr>

                                        <td class="label-td">

                                            <label for="confirmPassword">
                                                Confirm New Password:
                                            </label>

                                        </td>

                                        <td class="label-td">

                                            <input
                                                type="password"
                                                id="confirmPassword"
                                                class="input-text"
                                                style="width:100%;"
                                                minlength="6"
                                                required>

                                        </td>

                                    </tr>


                                    <!-- BUTTON -->

                                    <tr>

                                        <td
                                            colspan="2"
                                            style="text-align:center;">

                                            <br>

                                            <button
                                                type="submit"
                                                class="login-btn btn-primary btn"
                                                style="width:200px;">

                                                Change Password

                                            </button>

                                        </td>

                                    </tr>

                                </table>

                            </form>

                        </div>

                    </center>

                </td>

            </tr>

        </table>

    </div>

</div>


<script>

const API_BASE_URL =
    "http://localhost:5000/api/doctor";

const token =
    localStorage.getItem("token");

const userRole =
    localStorage.getItem("userRole");


// ==========================================
// LOGOUT
// ==========================================

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("userRole");
    localStorage.removeItem("userEmail");

    window.location.href =
        "../login.html";

}


// ==========================================
// AUTH CHECK
// ==========================================

if (
    !token ||
    (userRole && userRole !== "d")
) {

    logout();

}


// ==========================================
// TODAY DATE
// ==========================================

document.getElementById(
    "todayDate"
).textContent =
    new Date().toLocaleDateString("en-GB");


// ==========================================
// LOAD DOCTOR PROFILE
// ==========================================

async function loadProfile() {

    try {

        const response =
            await fetch(
                `${API_BASE_URL}/profile`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        console.log(
            "Doctor profile:",
            data
        );


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            logout();

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            return;

        }


        const doctor =
            data.doctor || {};


        document.getElementById(
            "profileName"
        ).textContent =
            doctor.docname ||
            "Doctor";


        document.getElementById(
            "profileEmail"
        ).textContent =
            doctor.docemail ||
            "";

    } catch (error) {

        console.error(
            "Profile error:",
            error
        );

    }

}


// ==========================================
// CHANGE PASSWORD
// ==========================================

document.getElementById(
    "passwordForm"
).addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const currentPassword =
            document.getElementById(
                "currentPassword"
            ).value;


        const newPassword =
            document.getElementById(
                "newPassword"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        if (newPassword.length < 6) {

            alert(
                "New password must be at least 6 characters."
            );

            return;

        }


        if (
            newPassword !==
            confirmPassword
        ) {

            alert(
                "New passwords do not match."
            );

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/change-password`,
                    {
                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " + token

                        },

                        body:
                            JSON.stringify({

                                currentPassword:
                                    currentPassword,

                                newPassword:
                                    newPassword

                            })

                    }
                );


            const data =
                await response.json();


            console.log(
                "Change password:",
                data
            );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                alert(
                    data.message ||
                    "Current password is incorrect."
                );

                return;

            }


            if (
                !response.ok ||
                !data.success
            ) {

                alert(
                    data.message ||
                    "Unable to change password."
                );

                return;

            }


            alert(
                data.message ||
                "Password changed successfully."
            );


            document.getElementById(
                "passwordForm"
            ).reset();


        } catch (error) {

            console.error(
                "Change password error:",
                error
            );

            alert(
                "Unable to connect to server."
            );

        }

    }
);


// ==========================================
// LOGOUT BUTTON
// ==========================================

document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    logout
);


// ==========================================
// LOAD PAGE
// ==========================================

if (token) {

    loadProfile();

}

</script>

</body>

</html>
