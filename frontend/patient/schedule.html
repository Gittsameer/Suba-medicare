<!-- ================================================= -->
<!-- JAVASCRIPT -->
<!-- ================================================= -->

<script>


// =====================================================
// API
// =====================================================

const API_BASE_URL =
    "http://localhost:5000/api/auth";


// =====================================================
// TOKEN
// =====================================================

const token =
    localStorage.getItem("token");


// =====================================================
// VARIABLES
// =====================================================

let allSessions = [];


// =====================================================
// LOGOUT
// =====================================================

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("userRole");
    localStorage.removeItem("userEmail");
    localStorage.removeItem("selectedScheduleId");

    window.location.href =
        "../index.html";

}


document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        logout
    );


// =====================================================
// TOKEN CHECK
// =====================================================

if (!token) {

    window.location.href =
        "../index.html";

}


// =====================================================
// TODAY DATE
// =====================================================

function loadTodayDate() {

    const today =
        new Date();


    document
        .getElementById("todayDate")
        .textContent =
        today.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );

}


loadTodayDate();


// =====================================================
// FORMAT DATE
// =====================================================

function formatDate(value) {

    if (!value) {
        return "Not available";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleDateString(
        "en-GB"
    );

}


// =====================================================
// SHOW MESSAGE
// =====================================================

function showMessage(message) {

    document
        .getElementById(
            "sessionsTableBody"
        )
        .innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="table-message">

                    ${message}

                </td>

            </tr>

        `;

}


// =====================================================
// LOAD PATIENT PROFILE
// =====================================================

async function loadPatientProfile() {

    try {

        const response =
            await fetch(
                `${API_BASE_URL}/profile`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        console.log(
            "Patient profile:",
            data
        );


        if (
            response.status === 401 ||
            response.status === 403
        ) {

            alert(
                data.message ||
                "Session expired. Please login again."
            );

            logout();

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            document
                .getElementById(
                    "profileName"
                )
                .textContent =
                "Patient";

            return;

        }


        document
            .getElementById(
                "profileName"
            )
            .textContent =
            data.patient?.pname ||
            "Patient";


        document
            .getElementById(
                "profileEmail"
            )
            .textContent =
            data.patient?.pemail ||
            "";

    }


    catch (error) {

        console.error(
            "Profile error:",
            error
        );

    }

}


// =====================================================
// RENDER SESSIONS
// =====================================================

function renderSessions(
    sessions
) {

    const tableBody =
        document.getElementById(
            "sessionsTableBody"
        );


    document
        .getElementById(
            "sessionCount"
        )
        .textContent =
        sessions.length;


    tableBody.innerHTML = "";


    if (!sessions.length) {

        showMessage(
            "No scheduled sessions available."
        );

        return;

    }


    sessions.forEach(
        function (session) {


            const row =
                document.createElement(
                    "tr"
                );


            // Session information

            row.innerHTML = `

                <td class="table-data">

                    ${session.title || "-"}

                </td>


                <td class="table-data">

                    ${session.docname ||
                      "Not assigned"}

                </td>


                <td class="table-data">

                    ${session.specialty ||
                      "Not specified"}

                </td>


                <td class="table-data">

                    ${formatDate(
                        session.scheduledate
                    )}

                    <br>

                    ${session.scheduletime || ""}

                </td>


                <td
                    class="table-data"
                    id="action-${session.scheduleid}">

                </td>

            `;


            tableBody.appendChild(
                row
            );


            // =========================================
            // BOOK BUTTON
            // =========================================

            const actionCell =
                document.getElementById(
                    `action-${session.scheduleid}`
                );


            const bookButton =
                document.createElement(
                    "button"
                );


            bookButton.type =
                "button";


            bookButton.className =
                "login-btn btn-primary btn book-btn";


            bookButton.textContent =
                "Book";


            // =========================================
            // IMPORTANT
            // =========================================
            // Actually call booking API
            // =========================================

            bookButton.addEventListener(
                "click",
                function () {

                    bookAppointment(
                        session.scheduleid,
                        bookButton
                    );

                }
            );


            actionCell.appendChild(
                bookButton
            );

        }
    );

}


// =====================================================
// BOOK APPOINTMENT
// =====================================================

async function bookAppointment(
    scheduleid,
    button
) {


    // =========================================
    // TOKEN CHECK
    // =========================================

    if (!token) {

        alert(
            "Session expired. Please login again."
        );

        logout();

        return;

    }


    // =========================================
    // CONFIRM
    // =========================================

    const confirmed =
        confirm(
            "Do you want to book this session?"
        );


    if (!confirmed) {

        return;

    }


    // Disable button
    button.disabled =
        true;

    button.textContent =
        "Booking...";


    try {


        // =====================================
        // POST BOOKING
        // =====================================

        const response =
            await fetch(
                `${API_BASE_URL}/book-appointment`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },


                    body: JSON.stringify({

                        scheduleid:
                            scheduleid

                    })

                }
            );


        const data =
            await response.json();


        console.log(
            "Booking response:",
            data
        );


        // =====================================
        // TOKEN EXPIRED
        // =====================================

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            alert(
                data.message ||
                "Session expired. Please login again."
            );

            logout();

            return;

        }


        // =====================================
        // ALREADY BOOKED
        // =====================================

        if (
            response.status === 409 &&
            data.message ===
            "You have already booked this session"
        ) {

            alert(
                "You have already booked this session."
            );

            button.disabled =
                false;

            button.textContent =
                "Book";

            return;

        }


        // =====================================
        // SESSION FULL
        // =====================================

        if (
            response.status === 409
        ) {

            alert(
                data.message ||
                "This session is fully booked."
            );

            button.disabled =
                false;

            button.textContent =
                "Book";

            return;

        }


        // =====================================
        // OTHER ERROR
        // =====================================

        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Unable to book appointment."
            );

            button.disabled =
                false;

            button.textContent =
                "Book";

            return;

        }


        // =====================================
        // SUCCESS
        // =====================================

        alert(
            "Appointment booked successfully.\n\n" +
            "Appointment No: " +
            data.apponum
        );


        // Go to bookings page

        window.location.href =
            "appointment.html";


    }


    catch (error) {

        console.error(
            "Booking error:",
            error
        );


        alert(
            "Unable to connect to the server."
        );


        button.disabled =
            false;

        button.textContent =
            "Book";

    }

}


// =====================================================
// FILTER SESSIONS
// =====================================================

function filterSessions() {

    const query =
        document
            .getElementById(
                "sessionSearch"
            )
            .value
            .trim()
            .toLowerCase();


    if (!query) {

        renderSessions(
            allSessions
        );

        return;

    }


    const filteredSessions =
        allSessions.filter(
            function (session) {

                return [

                    session.title,
                    session.docname,
                    session.specialty,
                    session.scheduledate,
                    session.scheduletime

                ].some(
                    function (value) {

                        return String(
                            value || ""
                        )
                        .toLowerCase()
                        .includes(query);

                    }
                );

            }
        );


    renderSessions(
        filteredSessions
    );

}


// =====================================================
// SEARCH
// =====================================================

document
    .getElementById(
        "searchForm"
    )
    .addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            filterSessions();

        }
    );


document
    .getElementById(
        "sessionSearch"
    )
    .addEventListener(
        "input",
        filterSessions
    );


// =====================================================
// LOAD SESSIONS
// =====================================================

async function loadSessions() {

    try {

        const response =
            await fetch(
                `${API_BASE_URL}/sessions`,
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );


        const data =
            await response.json();


        console.log(
            "Sessions:",
            data
        );


        // =====================================
        // TOKEN EXPIRED
        // =====================================

        if (
            response.status === 401 ||
            response.status === 403
        ) {

            alert(
                data.message ||
                "Session expired. Please login again."
            );

            logout();

            return;

        }


        if (
            !response.ok ||
            !data.success
        ) {

            showMessage(
                data.message ||
                "Unable to load sessions."
            );

            return;

        }


        allSessions =
            Array.isArray(
                data.sessions
            )
                ? data.sessions
                : [];


        renderSessions(
            allSessions
        );

    }


    catch (error) {

        console.error(
            "Sessions error:",
            error
        );


        showMessage(
            "Unable to connect to the server."
        );

    }

}


// =====================================================
// INITIALIZE
// =====================================================

async function initializePage() {

    if (!token) {

        window.location.href =
            "../index.html";

        return;

    }


    await loadPatientProfile();

    await loadSessions();

}


initializePage();

</script>


</body>
