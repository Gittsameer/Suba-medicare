    <div class="dash-body">

        <table border="0" width="100%"

            <tr>

                <td width="13%">
                    <a href="settings.html">

            <tr>
                <td colspan="4">

                    <center>

                        <table class="filter-container"
                               style="border:none;width:70%;"
                               border="0">

                            <tr>
                                <td>

                                <td>

</div>


<script>

const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "../login.html";
}

async function loadAccount() {

    try {

        const response = await fetch(
            "http://localhost:5000/api/auth/my-account",
            {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const data = await response.json();

        console.log("Account:", data);

        if (!data.success) {
            alert(data.message);
            return;
        }

        const patient = data.patient;

        document.getElementById("patientName").textContent =
            patient.pname || "Not available";

        document.getElementById("patientEmail").textContent =
            patient.pemail || "Not available";

        document.getElementById("patientAddress").textContent =
            patient.paddress || "Not available";

        document.getElementById("patientNic").textContent =
            patient.pnic || "Not available";

        document.getElementById("patientDob").textContent =
            patient.pdob || "Not available";

        document.getElementById("patientTel").textContent =
            patient.ptel || "Not available";

    } catch (error) {

        console.error("Account error:", error);

        alert("Unable to load account details.");

    }

}

loadAccount();

</script>

    <script src="patient-common.js"></script>
