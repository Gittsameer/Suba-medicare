<!-- ================= JAVASCRIPT ================= -->

<script>

const token = localStorage.getItem("token");


// Check login
if (!token) {

    window.location.href = "../login.html";

}


// ============================================
// CHANGE PASSWORD
// ============================================

async function changePassword() {

    const currentPassword =
        document
        .getElementById("currentPassword")
        .value;

    const newPassword =
        document
        .getElementById("newPassword")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    const message =
        document.getElementById("passwordMessage");


    // Empty fields
    if (!currentPassword ||
        !newPassword ||
        !confirmPassword) {

        message.textContent =
            "Please fill all fields.";

        return;

    }


    // Password length
    if (newPassword.length < 6) {

        message.textContent =
            "New password must be at least 6 characters.";

        return;

    }


    // Confirm password
    if (newPassword !== confirmPassword) {

        message.textContent =
            "New passwords do not match.";

        return;

    }


    try {

        const response = await fetch(
            "http://localhost:5000/api/auth/change-password",
            {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token

                },

                body: JSON.stringify({

                    currentPassword:
                        currentPassword,

                    newPassword:
                        newPassword

                })

            }
        );


        const data =
            await response.json();


        console.log(
            "Change password response:",
            data
        );


        if (!data.success) {

            message.textContent =
                data.message;

            return;

        }


        message.textContent =
            "Password changed successfully.";


        // Clear fields
        document
            .getElementById("currentPassword")
            .value = "";

        document
            .getElementById("newPassword")
            .value = "";

        document
            .getElementById("confirmPassword")
            .value = "";


    } catch (error) {

        console.error(
            "Change password error:",
            error
        );

        message.textContent =
            "Unable to change password.";

    }

}


// ============================================
// BUTTON
// ============================================

document
    .getElementById("changePasswordBtn")
    .addEventListener(
        "click",
        changePassword
    );

</script>
