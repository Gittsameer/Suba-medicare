                                    class="input-text"
                                    placeholder="Optional">

                            </div>

                            <br>

<script>


// ============================================
// TOKEN
// ============================================

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href =
        "../login.html";

}



// ============================================
// LOAD ACCOUNT
// ============================================

async function loadAccount() {

    try {

        const response =
            await fetch(
                "http://localhost:5000/api/auth/my-account",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        console.log(
            "Account:",
            data
        );


        if (!data.success) {

            document
                .getElementById("message")
                .textContent =
                data.message;

            return;

        }


        const patient =
            data.patient;


        document
            .getElementById("pname")
            .value =
            patient.pname || "";


        document
            .getElementById("paddress")
            .value =
            patient.paddress || "";


        document
            .getElementById("pnic")
            .value =
            patient.pnic || "";


        document
            .getElementById("pdob")
            .value =
            patient.pdob
                ? patient.pdob.substring(0, 10)
                : "";


        document
            .getElementById("ptel")
            .value =
            patient.ptel || "";


        // Load dependent separately

        await loadDependent();

    }


    catch (error) {

        console.error(
            "Load account error:",
            error
        );

        document
            .getElementById("message")
            .textContent =
            "Unable to load account.";

    }

}



// ============================================
// LOAD DEPENDENT
// ============================================

async function loadDependent() {

    try {

        const response =
            await fetch(
                "http://localhost:5000/api/auth/dependents",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        console.log(
            "Dependents:",
            data
        );


        const input =
            document.getElementById(
                "dependentName"
            );


        if (
            data.success &&
            data.dependents &&
            data.dependents.length > 0
        ) {

            // Show existing dependent

            input.value =
                data.dependents[0].dependentname;

        } else {

            // No dependent

            input.value = "";

        }

    }


    catch (error) {

        console.error(
            "Load dependent error:",
            error
        );

    }

}



// ============================================
// UPDATE ACCOUNT + DEPENDENT
// ============================================

async function updateAccount() {


    const pname =
        document
            .getElementById("pname")
            .value
            .trim();


    const paddress =
        document
            .getElementById("paddress")
            .value
            .trim();


    const pnic =
        document
            .getElementById("pnic")
            .value
            .trim();


    const pdob =
        document
            .getElementById("pdob")
            .value;


    const ptel =
        document
            .getElementById("ptel")
            .value
            .trim();


    const dependentname =
        document
            .getElementById("dependentName")
            .value
            .trim();


    const message =
        document
            .getElementById("message");



    // ========================================
    // VALIDATION
    // ========================================

    if (
        !pname ||
        !paddress ||
        !pnic ||
        !pdob ||
        !ptel
    ) {

        message.textContent =
            "Please fill all account fields.";

        return;

    }



    try {


        // ====================================
        // UPDATE PATIENT
        // ====================================

        const accountResponse =
            await fetch(
                "http://localhost:5000/api/auth/update-account",
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body: JSON.stringify({

                        pname,
                        paddress,
                        pnic,
                        pdob,
                        ptel

                    })

                }
            );


        const accountData =
            await accountResponse.json();


        console.log(
            "Account update:",
            accountData
        );


        if (!accountData.success) {

            message.textContent =
                accountData.message;

            return;

        }



        // ====================================
        // UPDATE DEPENDENT
        // ====================================

        const dependentResponse =
            await fetch(
                "http://localhost:5000/api/auth/update-dependent",
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },

                    body: JSON.stringify({

                        dependentname:
                            dependentname

                    })

                }
            );


        const dependentData =
            await dependentResponse.json();


        console.log(
            "Dependent update:",
            dependentData
        );


        if (!dependentData.success) {

            message.textContent =
                "Account updated, but dependent update failed: "
                + dependentData.message;

            return;

        }



        // ====================================
        // SUCCESS
        // ====================================

        message.textContent =
            "Account updated successfully.";


        // Keep the new dependent visible.
        // Do NOT clear the field.


    }


    catch (error) {

        console.error(
            "Update account error:",
            error
        );


        message.textContent =
            "Unable to update account.";

    }

}



// ============================================
// BUTTON
// ============================================

document
    .getElementById("updateBtn")
    .addEventListener(
        "click",
        updateAccount
    );



// ============================================
// LOAD PAGE
// ============================================

loadAccount();

</script>
