<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">

    <title>Login</title>
</head>

<body>

<center>

    <div class="container">

        <table border="0" style="margin:0;padding:0;width:60%;">

            <tr>
                <td>
                    <p class="header-text">
                        Welcome Back!
                    </p>
                </td>
            </tr>

            <tr>
                <td>
                    <p class="sub-text">
                        Login with your details to continue
                    </p>
                </td>
            </tr>

            <!-- LOGIN FORM -->
            <tr>
                <td>

                    <form id="loginForm">

                        <table border="0" width="100%">

                            <!-- EMAIL -->
                            <tr>
                                <td class="label-td">

                                    <label
                                        for="email"
                                        class="form-label">

                                        Email:

                                    </label>

                                </td>
                            </tr>

                            <tr>
                                <td class="label-td">

                                    <input
                                        type="email"
                                        id="email"
                                        name="useremail"
                                        class="input-text"
                                        placeholder="Email Address"
                                        autocomplete="email"
                                        required>

                                </td>
                            </tr>


                            <!-- PASSWORD -->
                            <tr>
                                <td class="label-td">

                                    <label
                                        for="password"
                                        class="form-label">

                                        Password:

                                    </label>

                                </td>
                            </tr>

                            <tr>
                                <td class="label-td">

                                    <input
                                        type="password"
                                        id="password"
                                        name="userpassword"
                                        class="input-text"
                                        placeholder="Password"
                                        autocomplete="current-password"
                                        required>

                                </td>
                            </tr>


                            <!-- SPACE -->
                            <tr>
                                <td>
                                    <br>
                                </td>
                            </tr>


                            <!-- LOGIN BUTTON -->
                            <tr>
                                <td>

                                    <input
                                        type="submit"
                                        value="Login"
                                        class="login-btn btn-primary btn"
                                        id="loginButton">

                                </td>
                            </tr>

                        </table>

                    </form>

                </td>
            </tr>


            <!-- SIGN UP -->
            <tr>
                <td>

                    <br>

                    <label
                        class="sub-text"
                        style="font-weight:280;">

                        Don't have an account?

                    </label>

                    <a
                        href="signup.html"
                        class="hover-link1 non-style-link">

                        Sign Up

                    </a>

                    <br>
                    <br>
                    <br>

                </td>
            </tr>

        </table>

    </div>

</center>


<script>

const API_URL =
    "http://localhost:5000/api/auth/login";


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            // ===============================
            // GET INPUT VALUES
            // ===============================

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("password")
                    .value;


            // ===============================
            // VALIDATION
            // ===============================

            if (!email || !password) {

                alert(
                    "Email and password are required."
                );

                return;
            }


            // Disable button
            const loginButton =
                document.getElementById(
                    "loginButton"
                );

            loginButton.disabled = true;

            loginButton.value = "Logging in...";


            try {

                // ===============================
                // LOGIN REQUEST
                // ===============================

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                // ===============================
                // READ RESPONSE
                // ===============================

                const data =
                    await response.json();


                console.log(
                    "Login response:",
                    data
                );


                // ===============================
                // LOGIN FAILED
                // ===============================

                if (
                    !response.ok ||
                    !data.success
                ) {

                    alert(
                        data.message ||
                        "Invalid email or password."
                    );

                    loginButton.disabled = false;
                    loginButton.value = "Login";

                    return;
                }


                // ===============================
                // CHECK TOKEN
                // ===============================

                if (!data.token) {

                    alert(
                        "Login successful, but token was not received."
                    );

                    loginButton.disabled = false;
                    loginButton.value = "Login";

                    return;
                }


                // ===============================
                // CHECK ROLE
                // ===============================

                if (!data.role) {

                    alert(
                        "Login successful, but user role was not received."
                    );

                    loginButton.disabled = false;
                    loginButton.value = "Login";

                    return;
                }


                // ===============================
                // SAVE LOGIN DATA
                // ===============================

                localStorage.setItem(
                    "token",
                    data.token
                );

                localStorage.setItem(
                    "userRole",
                    data.role
                );

                localStorage.setItem(
                    "userEmail",
                    data.email || email
                );


                console.log(
                    "Logged in role:",
                    data.role
                );


                // ===============================
                // ROLE REDIRECT
                // ===============================

                if (data.role === "p") {

                    window.location.href =
                        "patient/index.html";

                }

                else if (data.role === "d") {

                    window.location.href =
                        "doctor/index.html";

                }

                else if (data.role === "a") {

                    window.location.href =
                        "admin/index.html";

                }

                else {

                    localStorage.removeItem(
                        "token"
                    );

                    localStorage.removeItem(
                        "userRole"
                    );

                    localStorage.removeItem(
                        "userEmail"
                    );

                    alert(
                        "Invalid user role: " +
                        data.role
                    );

                    loginButton.disabled = false;
                    loginButton.value = "Login";
                }


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                alert(
                    "Unable to connect to the server."
                );

                loginButton.disabled = false;
                loginButton.value = "Login";
            }

        }
    );

</script>

</body>
</html>
